# End-effector registry. Distances are metres and angles are radians.
tools:
  none:
    description: "Bare robot flange with no tool"

  schunk_pgf_100:
    description: "SCHUNK PGF 100 brick gripper in its open CAD configuration"
    finger_travel: 0.008875
    # Supplied CAD verification: direct coupling-plane mount, no QC master.
    # Pad midpoint is CAD (0, 0, -201.35 mm); coupling face is z=41.78 mm.
    flange_tcp:
      xyz: [0.0, 0.0, 0.24313]
      rpy: [0.0, 0.0, 0.0]
    meshes:
      visual_body: "meshes/optimized/end_effectors/visual_body.stl"
      visual_left_finger: "meshes/optimized/end_effectors/visual_leftfinger.stl"
      visual_right_finger: "meshes/optimized/end_effectors/visual_rightfinger.stl"
      collision_body: "meshes/optimized/end_effectors/collision_body.stl"
      collision_left_finger: "meshes/optimized/end_effectors/collision_leftfinger.stl"
      collision_right_finger: "meshes/optimized/end_effectors/collision_rightfinger.stl"
