# Fixture CAD poses and semantic frames used to build the workcell.
#
# pose   : position and orientation of the fixture BASE in the workcell_base frame.
#          xyz in metres.
#          rpy in radians.
#
#          Initial values are the as-designed (CAD) positions.  Overwrite after
#          physical survey of the installed workcell.
#
# frames : named semantic frames relative to the fixture BASE link.
#          Each entry becomes a TF link published by robot_state_publisher:
#            ${prefix}${frame_name}   e.g.  SS_approach, TC_RR_dock, MHS_load_approach
#          Task home, speeds and rail offsets live in gh_motion_profile.json.
#          xyz/rpy/quat follow the same convention as pose.
#          Set to {} if no semantic frames are needed for a fixture.

fixtures:

  platform:
    description: "Main work platform surface"
    # The platform macro uses pos_z (= pose.xyz[2]) as the calibrated top surface height.
    pose:
      xyz: [0.0, 0.0, 0.044]
      rpy: [0.0, 0.0, 0.0]
    frames: {}

  material_handling_station:
    description: "Material handling station"
    pose:
      xyz: [2.070740859, 4.503546969, -0.367793700]
      rpy: [0.002637207, -0.001884356, -0.006336069]
    frames: {}

  stationary_saw:
    description: "Stationary circular saw"
    pose:
      xyz: [-1.423849809, 3.138570587, -0.363398631]
      rpy: [0.0, -0.004530035, 0.011332967]
    frames: {}

  milling_table:
    description: "CNC milling table origin, top surface bottom-left corner"
    pose:
      xyz: [-1.018799012, 4.387074083, 0.371454666]
      rpy: [0.0, 0.0, 0.0]
    frames: {}

  tool_changing_station_rr:
    description: "Tool changing station for RR arm"
    pose:
      xyz: [4.530877611, -0.502742169, -0.3635]
      rpy: [0.0, 0.0, 0.0]
    frames: {}

  tool_changing_station_ll:
    description: "Tool changing station for LL arm"
    pose:
      xyz: [4.505833886, 2.503951683, -0.356080699]
      rpy: [-0.000290022, 0.000001365, 0.004706949]
    frames: {}

  irb7600:
    description: "ABB IRB7600 decorative object"
    pose:
      xyz: [4.695842450, 1.648095331, -0.3735]
      rpy: [0.0, 0.004530035, -3.130259687]
    frames: {}
