controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    LL_manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    RR_manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

LL_manipulator_controller:
  ros__parameters:
    joints:
      - joint_LL_ext_1
      - joint_LL_1
      - joint_LL_2
      - joint_LL_3
      - joint_LL_4
      - joint_LL_5
      - joint_LL_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      joint_LL_ext_1: {trajectory: 0.05, goal: 0.02}
      joint_LL_1: {trajectory: 0.2, goal: 0.1}
      joint_LL_2: {trajectory: 0.2, goal: 0.1}
      joint_LL_3: {trajectory: 0.2, goal: 0.1}
      joint_LL_4: {trajectory: 0.2, goal: 0.1}
      joint_LL_5: {trajectory: 0.2, goal: 0.1}
      joint_LL_6: {trajectory: 0.2, goal: 0.1}

RR_manipulator_controller:
  ros__parameters:
    joints:
      - joint_RR_ext_1
      - joint_RR_1
      - joint_RR_2
      - joint_RR_3
      - joint_RR_4
      - joint_RR_5
      - joint_RR_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      joint_RR_ext_1: {trajectory: 0.05, goal: 0.02}
      joint_RR_1: {trajectory: 0.2, goal: 0.1}
      joint_RR_2: {trajectory: 0.2, goal: 0.1}
      joint_RR_3: {trajectory: 0.2, goal: 0.1}
      joint_RR_4: {trajectory: 0.2, goal: 0.1}
      joint_RR_5: {trajectory: 0.2, goal: 0.1}
      joint_RR_6: {trajectory: 0.2, goal: 0.1}
